<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #4caf50;
        }
        h2{
            text-align: center;
            color: #ececec;
        }
        form{
            width: 90%;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc  ;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        label{
            display: block;
            margin-bottom: 5px;
            color: #333;

        }
        input[type="number"], select{
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="button"]{
            width: 100%;
            background-color: #4caf50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="button"]:hover{
            background-color: #45a049;
        }

    </style>
</head>
<body>
    <h2>PROBANDO EL OBJETO GLOBAL ARRAY</h2>
    <form>
    mostrar informacion:
    <div id="mostrar" style="color: green;">...</div>
    <div id="mostrar1" style="color: green;">...</div>
    <div id="mostrar2" style="color: green;">...</div>
    <div id="mostrar3" style="color: green;">...</div>
    <div id="mostrar4" style="color: green;">...</div>
    <div id="mostrar5" style="color: green;">...</div><hr>
    </form>
</body>
</html>
<script src="js/JS funciones.js"></script>
<Script>
frutas = ['Banana','Pera','Manzana'];
valores = [5,20,13,45,-1,0,21];
datos = ['Toyota',1800.50,'Modelo 2023'];
document.getElementById('mostrar').innerText = frutas;
document.getElementById('mostrar1').innerText = 'TAMAÑO: '+ frutas.length; frutas.push('Kiwi'); //adiciona un elemento
document.getElementById('mostrar2').innerText = "ADICIONAR AL FINAL frutas.push('kiwi'): "+ frutas; frutas.pop();
document.getElementById('mostrar3').innerText = "ELIMINAR DEL FINAL frutas.pop('Piña'): "+ frutas; frutas.unshift('Piña');
document.getElementById('mostrar4').innerText = "ADICIONA AL PRINCIPIO frutas.unshift('Piña'): "+ frutas; frutas.shift();
document.getElementById('mostrar5').innerText = "ELIMINAR DEL PRINCIPIO frutas.shift(): "+ frutas;

</Script>
