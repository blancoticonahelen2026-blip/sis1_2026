<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array2</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #4caf50;
        }
        h2{
            text-align: center;
            color: #ececec;
        }
        form{
            width: 90%;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc  ;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        label{
            display: block;
            margin-bottom: 5px;
            color: #333;

        }
        input[type="text"], select{
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
        }
        input[type="button"]{
            width: 100%;
            background-color: #4caf50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="button"]:hover{
            background-color: #45a049;
        }

    </style>
</head>
<body>
    <h2>PROBANDO EL OBJETO GLOBAL ARRAY</h2>
    <form>
    <label for="n"><B>Adicione los elementos a un vector:</B></label>
    <input type="text" name="n" id="n">
    <input type="button" value="ADICIONAR" onclick="adicionar()">
    <input type="button" value="Girar a la izquierda" onclick="girariz()">
    <input type="button" value="Girar a la derecha" onclick="girarder()"><hr>
    <div id="mostrar" style="color: green;">...</div><hr>
    </form>
</body>
</html>
<script src="js/JS funciones.js"></script>
<Script>
frutas = [];
function adicionar(){
    let n = document.getElementById("n").value; 
    frutas.push(n);
    document.getElementById("n").value = "";
    mostrar();
}
function girariz(){
    let aux = frutas.shift(); frutas.push(aux);
    mostrar();
}
function girarder(){
    let aux = frutas.pop(); frutas.unshift(aux);
    mostrar();
}
function mostrar(){
    document.getElementById("mostrar").innerText=frutas;
}
document.getElementById('mostrar').innerText = frutas;
</Script>
