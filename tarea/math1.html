<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math1</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #4caf50;
        }
        h2{
            text-align: center;
            color: #ececec;
        }
        form{
            width: 300px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc  ;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        label{
            display: block;
            margin-bottom: 5px;
            color: #333;

        }
        input[type="number"], select{
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="button"]{
            width: 100%;
            background-color: #4caf50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="button"]:hover{
            background-color: #45a049;
        }

    </style>
</head>
<body>
    <h2>PROBANDO EL OBJETO GLOBAL MATH</h2>
    <hr>
    esto es la propiedad Math.PI:
    <div id="mostrar">...</div><hr>
    Esto es un metodo (potencia) pow (x,y) = x<sup>y</sup><br> Ejemplo: <b>2<sup>3</sup>:</b>
    <div id="mostrar2">...</div><hr>
    Esto es un metodo random ():
    <div id="mostrar3">...</div><hr>
    El ganado del 1 al 10 es:
    <div id="mostrar4">...</div>
</body>
</html>
<script src="js/JS funciones.js"></script>
<Script>
resultado=Math.PI; //propiedad
res2=Math.pow(2,3); //metodo
res3=Math.random();
document.getElementById('mostrar').innerText = resultado;
document.getElementById('mostrar2').innerText = res2;
document.getElementById('mostrar3').innerText = res3;
ganador=Math.floor(res3*10);
document.getElementById('mostrar4').innerText = ganador;
</Script>
