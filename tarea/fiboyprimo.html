<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #4caf50;
        }
        h2{
            text-align: center;
            color: #ececec;
        }
        form{
            width: 300px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc  ;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        label{
            display: block;
            margin-bottom: 5px;
            color: #333;

        }
        input[type="number"], select{
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="button"]{
            width: 100%;
            background-color: #4caf50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="button"]:hover{
            background-color: #45a049;
        }

    </style>
</head>
<body>
    <h2>SERIE FIBONACCI</h2>
    <form action="#" method="post">
    <label for="n"><B>Introduzca los N valores a mostrar:</B></label>
    <input type="number" name="n" id="n">
    <input type="button" value="GENERAR" onclick="generar()">
    <hr>
    <h3>RESULTADO</h3>
    <div id="res" style="font-size: 18px; color: darkgreen;">
    ...</div>
    </form>
    <h2>SERIE DE NUMEROS PRIMOS</h2>
    <form action="#" method="post">
    <label for="n2"><B>Introduzca los N valores a mostrar:</B></label>
    <input type="number" name="n2" id="n2">
    <input type="button" value="GENERAR" onclick="generar2()">
    <hr>
    <h3>RESULTADO</h3>
    <div id="res2" style="font-size: 18px; color: darkgreen;">
    ...</div>
    </form>

</body>
</html>
<script src="js/JS funciones.js"></script>
<script>
    function generar() {
        n = document.getElementById('n').value;
        document.getElementById('res').innerText = fibo(n);
    }
     function generar2() {
        n = document.getElementById('n2').value;
        document.getElementById('res2').innerText = primos(n);
    }
</script>
