<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #1a932c;
        }
        h2{
            text-align: center;
            color: #ececec;
        }
        form{
            width: 300px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc  ;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        label{
            display: block;
            margin-bottom: 5px;
            color: #333;

        }
        input[type="number"], select{
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="submit"]{
            width: 100%;
            background-color: #4caf50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover{
            background-color: #45a049;
        }
        th{
            background-color: brown;
            color: white;
            text-align: center;
            padding: 12px;
            border: 1px solid rgb(0, 0, 0);
            border-radius:3px;
        }
        table{
            width: 90%;
            max-width: 800;
            border-collapse: collapse ;
            margin: 30px auto;
        }

    </style>
</head>
<body>
    <h2>EVENTOS</h2>
    <table>
        <tr>
            <th>CANT</th>
            <th>PRECIO</th>
            <th>SUBTOTAL</th>
        </tr>
        <tr>
            <td><input type="number" name="" id="cant"></td>
            <td><input type="number" name="" id="precio"></td>
            <td><span id="subtotal">0.00</span></td>
        </tr>
    </table>
</body>
</html>
<script>
    const cant = document.getElementById('cant');
    const precio = document.getElementById('precio');
    const subtotal = document.getElementById('subtotal')

    function calc(){
        c = parseFloat(cant.value) || 0;
        p = parseFloat(precio.value) || 0;
        subtotal.innerText = c + p;
        
    }

    cant.addEventListener('keyup', calc);
    precio.addEventListener('keyup', calc);
</script>
