<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERIE FIBONACCI</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #4CAF50;
        }
        h2{
            text-align: center;
            color: white;
        }
        form{
            width: 300px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 15px;
            background-color: #f9f9f9;
        }
        label{
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        input[type="number"], input[type="email"], select{
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="button"]{
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="button"]:hover{
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h2>SERIE FIBONACCI</h2>
    <form action="#" method="post">
        <label for="n"><b>Introduzca los N valores a mostrar: </b> </label>
        <input type="number" id="n">
        <input type="button" value="Generar" onclick="generar()">
        <hr>
    <h3>RESULTADO:</h3>
    <div id="res" style="font-size: 18px; color: darkgreen">...</div>
    </form>
    <hr>
    <h2>SERIE DE NUMEROS PRIMOS</h2>
    <form action="#" method="post">
        <label for="n2"><b>Introduzca los N valores a mostrar: </b> </label>
        <input type="number" id="n2">
        <input type="button" value="Generar" onclick="generar2()">
        <hr>
    <h3>RESULTADO:</h3>
    <div id="res2" style="font-size: 18px; color: darkgreen">...</div>
    </form>
    
</body>
</html>
<script>
    function generar() {
        n = document.getElementById('n').value; // getter obtener
        //logica de mi algoritmo
        document.getElementById('res').innerText = fibo(n); // setter poner un valor
    }
        function generar2() {
        n = document.getElementById('n2').value; // getter obtener
        //logica de mi algoritmo
        document.getElementById('res2').innerText = primos(n); // setter poner un valor
    }

    /*catalogo de funciones*/
    function fibo(n) { //n es entero
        i = 1;
        a = 0; b = 1;
        res = "";
        while (i<=n) {
            res += a + ', ';
            c = a + b;
            a = b;
            b = c;
            i++
        }
        return res;
    }
    function primos(n) {
    // n es entero positivo
    res = "";
    primos = 0;
    for (i = 2; primos < n; i++) {
        esPrimo = true;
        for (j = 2; j * j <= i; j++) {
            if (i % j === 0) {
                esPrimo = false;
                break;
            }
        }
        if (esPrimo) {
            res += i + ', ';
            primos++;
        }
    }
    return res;
    }

</script>
