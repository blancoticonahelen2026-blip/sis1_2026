<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #5b0707fb;
        }
        h2{
            text-align: center;
            color: #ececec;
        }
        form{
            width: 300px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc  ;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        label{
            display: block;
            margin-bottom: 5px;
            color: #333;

        }
        input[type="number"], select{
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="button"]{
            width: 100%;
            background-color: #8d1d17;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="button"]:hover{
            background-color: #e91313;
        }

    </style>
</head>
<body>
    <h2>NOTAS DE CALIFICACION</h2>
    <form action="procesar.php" method="post">
    <label for="nombres"><b>INFORMATICA BASICA:</b></label>
    <input type="number" id="informatica" placeholder="Ingrese su calificacion">
<br>
    <label for="apellidos"><b>MATEMATICA:</b></label>
    <input type="number" id="matematica" placeholder="Ingrese su calificacion">
<br>
    <label for="apellidos"><b>FISICA:</b></label>
    <input type="number" id="fisica" placeholder="Ingrese su calificacion">
<br>
    <label for="apellidos"><b>QUIMICA:</b></label>
    <input type="number" id="quimica" placeholder="Ingrese su calificacion">

    <input type="button" value="Calcular" onclick="calcular()">

    <span>RESULTADO:</span>
    <div id="res" style="font-size: 18px; color: rgb(144, 5, 5);">
    ...
    </div>
</form>
</body>
</html>
<script>
function calcular(){
    let info= Number(document.getElementById("informatica").value);
    let mate= Number(document.getElementById("matematica").value);
    let fis= Number(document.getElementById("fisica").value);
    let quim= Number(document.getElementById("quimica").value);
    let apr=0;
    let res=" ";
    if(info>=51){
        apr++;
    }
    if(mate>=51){
        apr++;
    }
    if(fis>=51){
        apr++;
    }
    if(quim>=51){
        apr++;
    }
    if(apr>=3){
        res='<span style="color:green; font-weight:bold;">APROBADO</span>';
    } else {
        res = '<span style="color:red; font-weight:bold;">NO APRUEBA</span>';
    }
    document.getElementById('res').innerHTML = res;
}
</script>
