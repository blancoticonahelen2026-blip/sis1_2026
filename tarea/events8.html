
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENTOS</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #4CAF50;
        }

        h2 {
            text-align: center;
            color: #ececec;
        }

        form {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 15px;
            background-color: #f9f9f9;
            box-sizing: border-box;
            overflow-x: auto;
        }

        form h3 {
            text-align: center;
        }

        .tabla-bootstrap {
            width: 100%;
            margin-bottom: 1rem;
            color: #212529;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            background-color: #fff;
            table-layout: fixed;
        }

        .tabla-bootstrap th,
        .tabla-bootstrap td {
            padding: 12px;
            vertical-align: middle;
            border: 1px solid #dee2e6;
            text-align: center;
            overflow-wrap: break-word;
        }

        .tabla-bootstrap th {
            background-color: #f8f9fa;
            font-weight: 600;
        }

        .tabla-bootstrap tbody tr:hover {
            background-color: rgba(0, 0, 0, 0.03);
        }

        .tabla-bootstrap select,
        .tabla-bootstrap input[type="number"],
        .tabla-bootstrap input[type="text"] {
            width: 100%;
            min-width: 0;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        #foto, #foto2 {
            display: block;
            width: 200px;
            max-width: 100%;
            height: 150px;
            object-fit: contain;
            margin: 10px auto;
            box-sizing: border-box;
        }

        .total-pagar {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            color: #000000;
            margin-top: 20px;
            padding: 15px;
            background-color: #fff;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        @media (max-width: 600px) {
            form {
                width: 98%;
                padding: 8px;
            }

            .tabla-bootstrap th,
            .tabla-bootstrap td {
                padding: 5px;
                font-size: 11px;
            }

            #foto, #foto2 {
                height: 100px;
            }

            .total-pagar {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <h2>EVENTOS</h2>
    <form action="script.php" method="get">
        <h3>SELECCIONAR EL PRODUCTO</h3>
        <table class="tabla-bootstrap">
            <thead>
                <tr>
                    <th>Nro</th>
                    <th>CANTIDAD</th>
                    <th>PRODUCTO</th>
                    <th>PRECIO U.</th>
                    <th>SUBTOTAL</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>
                        <input type="number"
                               name="cantidad1"
                               id="cantidad1"
                               min="1"
                               value="1"
                               required>
                    </td>
                    <td>
                        <select name="producto" id="producto">
                            <option value="">SELECCIONE SU PRODUCTO..</option>
                            <option value="computadora">COMPUTADORA</option>
                            <option value="placa">PLACA MADRE</option>
                            <option value="cpu">CPU</option>
                        </select>
                        <img src=""
                             alt="Imagen del producto"
                             id="foto"
                             style="display: none;">
                    </td>
                    <td>
                        <input type="number"
                               name="precio1"
                               id="precio1"
                               min="0"
                               step="0.01"
                               value="0"
                               required>
                    </td>
                    <td>
                        <input type="text"
                               name="subtotal1"
                               id="subtotal1"
                               value="0.00"
                               readonly>
                    </td>
                </tr>
                <tr>
                    <td>2</td>

                    <td>
                        <input type="number"
                               name="cantidad2"
                               id="cantidad2"
                               min="1"
                               value="1"
                               required>
                    </td>

                    <td>
                        <select name="producto2" id="producto2">
                            <option value="">SELECCIONE SU PRODUCTO..</option>
                            <option value="computadora">COMPUTADORA</option>
                            <option value="placa">PLACA MADRE</option>
                            <option value="cpu">CPU</option>
                        </select>

                        <img src=""
                             alt="Imagen del producto"
                             id="foto2"
                             style="display: none;">
                    </td>

                    <td>
                        <input type="number"
                               name="precio2"
                               id="precio2"
                               min="0"
                               step="0.01"
                               value="0"
                               required>
                    </td>

                    <td>
                        <input type="text"
                               name="subtotal2"
                               id="subtotal2"
                               value="0.00"
                               readonly>
                    </td>
                </tr>

            </tbody>
        </table>
        <div class="total-pagar">
            TOTAL A PAGAR: Bs. <span id="total">0.00</span>
        </div>

    </form>

    <script>
        function mostrarImagen(productoId, fotoId) {
            const producto = document.getElementById(productoId);
            const foto = document.getElementById(fotoId);

            producto.addEventListener("change", function () {
                switch (producto.value) {
                    case "computadora":
                        foto.src = "imagenes/compu.jpg";
                        foto.style.display = "block";
                        break;

                    case "cpu":
                        foto.src = "imagenes/cpu.jpg";
                        foto.style.display = "block";
                        break;

                    case "placa":
                        foto.src = "imagenes/placa.png";
                        foto.style.display = "block";
                        break;

                    default:
                        foto.src = "";
                        foto.style.display = "none";
                        break;
                }
            });
        }
        mostrarImagen("producto", "foto");
        mostrarImagen("producto2", "foto2");
    </script>
    <script>
        function calcularTotal() {
            const cantidad1 = Number(
                document.getElementById("cantidad1").value
            ) || 0;

            const precio1 = Number(
                document.getElementById("precio1").value
            ) || 0;
            const subtotal1 = cantidad1 * precio1;
            document.getElementById("subtotal1").value =
                subtotal1.toFixed(2);
            const cantidad2 = Number(
                document.getElementById("cantidad2").value
            ) || 0;
            const precio2 = Number(
                document.getElementById("precio2").value
            ) || 0;
            const subtotal2 = cantidad2 * precio2;
            document.getElementById("subtotal2").value =
                subtotal2.toFixed(2);
            const total = subtotal1 + subtotal2;
            document.getElementById("total").textContent =
                total.toFixed(2);
        }
        document.getElementById("cantidad1")
            .addEventListener("input", calcularTotal);

        document.getElementById("precio1")
            .addEventListener("input", calcularTotal);

        document.getElementById("cantidad2")
            .addEventListener("input", calcularTotal);

        document.getElementById("precio2")
            .addEventListener("input", calcularTotal);
        calcularTotal();
    </script>

</body>
</html>
