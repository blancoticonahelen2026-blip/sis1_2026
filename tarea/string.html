<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>string</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #4caf50;
        }
        h2{
            text-align: center;
            color: #ececec;
        }
        form{
            width: 90%;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc  ;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        label{
            display: block;
            margin-bottom: 5px;
            color: #333;

        }
        input[type="text"], select{
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
        }
        input[type="button"]{
            width: 100%;
            background-color: #4caf50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="button"]:hover{
            background-color: #45a049;
        }

    </style>
</head>
<body>
    <h2>PROBANDO EL OBJETO GLOBAL STRING</h2>
    <form>
    mostrar informacion:
    <div id="mostrar" style="color: green;">...</div>
    <div id="mostrar1" style="color: green;">...</div>
    <div id="mostrar2" style="color: green;">...</div>
    <div id="mostrar3" style="color: green;">...</div>
    <div id="mostrar4" style="color: green;">...</div><hr>
    </form>
</body>
</html>
<script src="js/JS funciones.js"></script>
<Script>
    texto ="Hola Mundo cruel ya no quiero vivir!";
    //texto=['H','o','l','a',' ','m','u','n','d','o','!'];
    document.getElementById('mostrar').innerText = texto.length;
    document.getElementById('mostrar1').innerText = texto.toUpperCase();
    document.getElementById('mostrar2').innerText = texto[5];
    tresletras='';
    for(i=0;i<3;i++){
        tresletras+=texto[i];
    }
    document.getElementById('mostrar3').innerText = tresletras;
    //seisletras=texto.substring(0,6);
    //document.getElementById('mostrar4').innerText = seisletras;
    pizza=texto.split(" ");
    document.getElementById('mostrar4').innerText = pizza;
</Script>
