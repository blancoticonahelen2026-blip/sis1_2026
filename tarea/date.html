<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATE</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #4caf50;
        }
        h2{
            text-align: center;
            color: #ececec;
        }
        form{
            width: 90%;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc  ;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        label{
            display: block;
            margin-bottom: 5px;
            color: #333;

        }
        input[type="text"], select{
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
        }
        input[type="button"]{
            width: 100%;
            background-color: #4caf50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="button"]:hover{
            background-color: #45a049;
        }

    </style>
</head>
<body>
    <h2>PROBANDO EL OBJETO GLOBAL DATE</h2>
    <form>
    Mostrar Fecha:
    <div id="mostrar" style="color: green;">...</div>
    <div id="mostrar1" style="color: green;">...</div>
    <div id="mostrar2" style="color: green;">...</div><hr>
    </form>
</body>
</html>
<script src="js/JS funciones.js"></script>
<Script>
    hoy=new Date("2002-11-30T00:00:00");
    document.getElementById('mostrar').innerText = hoy;
    fecha=hoy.getDate()+"/"+(hoy.getMonth()+1)+"/"+hoy.getFullYear();
    document.getElementById('mostrar1').innerText = fecha;
    dia=hoy.getDay();

        case 0: dia_semana="Domingo";break;

        case 2: dia_semana="Martes";break;
        case 3: dia_semana="Miercoles";break;
        case 4: dia_semana="Jueves";break;
        case 5: dia_semana="Viernes";break;
        case 6: dia_semana="Sabado";break;

    }
    document.getElementById('mostrar2').innerText = dia_semana;
</Script>
