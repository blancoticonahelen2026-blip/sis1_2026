<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Navegación Horizontal con Dropdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
        }

        .navbar {
            background-color: #2d2d2d;
            width: 100%;
        }

        .menu-principal {
            display: flex;
            list-style: none;
        }

        .menu-principal > li {
            position: relative;
        }

        .menu-principal > li > a {
            display: block;
            padding: 15px 25px;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            transition: background-color 0.2s ease;
        }

        /* FLECHITAS */
        .menu-principal > li > a::after {
            content: " ▾";
            font-size: 12px;
            opacity: 0.8;
        }

        .menu-principal > li:hover > a {
            background-color: #444444;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #ffffff;
            list-style: none;
            min-width: 200px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.15);
            border: 1px solid #e0e0e0;
        }

        .dropdown li a {
            display: block;
            padding: 12px 20px;
            color: #333333;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s ease, background-color 0.2s ease, padding-left 0.2s ease;
        }

        /* DEGRADADO PLOMO AL HOVER */
        .dropdown li a:hover {
            color: #f1c40f;
            background: linear-gradient(to right, #171717, #555555);
            padding-left: 30px;
        }

        .menu-principal > li:hover .dropdown {
            display: block;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <ul class="menu-principal">
            <li>
                <a href="#">Inicio</a>
                <ul class="dropdown">
                    <li><a href="#">Dashboard</a></li>
                    <li><a href="#">Perfil</a></li>
                    <li><a href="#">Configuración</a></li>
                </ul>
            </li>

            <li>
                <a href="#">Ventas</a>
                <ul class="dropdown">
                    <li><a href="#">Nueva venta</a></li>
                    <li><a href="#">Clientes</a></li>
                    <li><a href="#">Facturas</a></li>
                </ul>
            </li>

            <li>
                <a href="#">Compras</a>
                <ul class="dropdown">
                    <li><a href="#">Nueva compra</a></li>
                    <li><a href="#">Proveedores</a></li>
                    <li><a href="#">Historial</a></li>
                </ul>
            </li>

            <li>
                <a href="#">Reportes</a>
                <ul class="dropdown">
                    <li><a href="#">Ventas</a></li>
                    <li><a href="#">Compras</a></li>
                    <li><a href="#">Inventario</a></li>
                </ul>
            </li>
        </ul>
    </nav>

</body>
</html>
